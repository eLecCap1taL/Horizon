// credit to CSAFAP, for sharing this method
// this file is used to simplify the calling of bypassed commands

alias +$forward "-!forward"
alias -$forward "+!forward"
alias $forward_clear "!forward 999 0 0"

alias +$back "-!back"
alias -$back "+!back"
alias $back_clear "!back 999 0 0"

alias +$left "-!left"
alias -$left "+!left"
alias $left_clear "!left 999 0 0"

alias +$right "-!right"
alias -$right "+!right"
alias $right_clear "!right 999 0 0"

alias +$jump "-!jump"
alias -$jump "+!jump"
alias $jump_clear "!jump 999 0 0"

alias +$duck "-!duck"
alias -$duck "+!duck"
alias $duck_clear "!duck 999 0 0"

alias +$sprint "-!sprint"
alias -$sprint "+!sprint"
alias $sprint_clear "!sprint 999 0 0"

alias +$use "-!use"
alias -$use "+!use"
alias $use_clear "!use 999 0 0"

alias +$attack "-!attack"
alias -$attack "+!attack"
alias $attack_clear "!attack 999 0 0"

alias +$attack2 "-!attack2"
alias -$attack2 "+!attack2"
alias $attack2_clear "!attack2 999 0 0"

alias +$reload "-!reload"`
