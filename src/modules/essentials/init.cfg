
alias hzEss_jump "exec Horizon/src/modules/essentials/modules/jump.cfg"

alias +hzEss_JT "alias hzEss_ticker +hzEss_JT_t1"
alias +hzEss_JT_t1 "hzEss_jump;attack -999 0 0;attack2 -999 0 0;alias hzEss_ticker"
alias -hzEss_JT ""

alias +hzEss_FJT "alias hzEss_ticker +hzEss_FJT_t1"
alias +hzEss_FJT_t1 "+forward;hzEss_jump;+attack;attack -999 0 0;attack2 -999 0 0;alias hzEss_ticker"
alias -hzEss_FJT "-forward"

alias +hzEss_CJ "+duck;alias hzEss_ticker +hzEss_CJ_t1"
alias +hzEss_CJ_t1 "hzEss_jump;alias hzEss_ticker"
alias -hzEss_CJ "-duck"