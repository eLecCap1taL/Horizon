// 引入 inctrl 的逻辑翻译层
exec Horizon/src/modules/inctrl/logics.cfg

// 设置 inctrl 的移动底层
// 直接使用 mv 或通过 autostop 层使用 mv
alias inctrl.use_autostop.enable    "say unsupported;echo [Horizon] inctrl.use_autostop.enable is not supported"
alias inctrl.use_autostop.disable   "alias inctrl.mv.fb.F inctrl.mv.fb.F;alias inctrl.mv.fb.B inctrl.mv.fb.B;alias inctrl.FB.S inctrl.mv.fb.S;alias inctrl.mv.rl.R inctrl.mv.rl.R;alias inctrl.mv.rl.L inctrl.mv.rl.L;alias inctrl.mv.rl.S inctrl.mv.rl.S"

// 设置 inctrl 的移动逻辑
// 使用 norm | socd | null
alias inctrl.use_norm "alias inctrl."
alias inctrl.use_socd ""
alias inctrl.use_null

// 重置 inctrl
alias inctrl.reset "inctrl.norm.fb.00;inctrl.norm.rl.00;inctrl.socd.fb.00;inctrl.socd.rl.00;inctrl.null.fb.00;inctrl.null.rl.00"