// 引入 inctrl 的逻辑翻译层
exec Horizon/src/modules/inctrl/logics.cfg

// 设置 inctrl 的移动底层
// 直接使用 mv 或通过 autostop 层使用 mv
// 当 inctrl 直接使用 mv 时，需要手动指定移动底层
// 当 inctrl 使用 autostop 层时，由于 autostop 内部可能调用多种移动以实现无延迟急停，我们需要在 autostop 层中指定移动底层，因此此处指定无效
alias inctrl.mv.fb.S "echoln [Horizon] You havn't set inctrl.mv.fb.S.gate yet"
alias inctrl.mv.fb.F "echoln [Horizon] You havn't set inctrl.mv.fb.F.gate yet"
alias inctrl.mv.fb.B "echoln [Horizon] You havn't set inctrl.mv.fb.B.gate yet"
alias inctrl.fb.use_autostop.enable "say unsupported;echoln [Horizon] inctrl.fb.use_autostop.enable is not supported"
alias inctrl.fb.use_autostop.disable "alias inctrl.mv.fb.S inctrl.mv.fb.S.gate;alias inctrl.mv.fb.F inctrl.mv.fb.F.gate;alias inctrl.mv.fb.B inctrl.mv.fb.B.gate"
alias inctrl.fb.use_joy "alias inctrl.mv.fb.S.gate mv.basic.joy.fb.S;alias inctrl.mv.fb.B.gate mv.basic.joy.fb.B;alias inctrl.mv.fb.F.gate mv.basic.joy.fb.F"
alias inctrl.fb.use_klb "alias inctrl.mv.fb.S.gate mv.basic.klb.fb.S;alias inctrl.mv.fb.B.gate mv.basic.klb.fb.B;alias inctrl.mv.fb.F.gate mv.basic.klb.fb.F"

alias inctrl.mv.rl.S "echoln [Horizon] You havn't set inctrl.mv.rl.S.gate yet"
alias inctrl.mv.rl.R "echoln [Horizon] You havn't set inctrl.mv.rl.R.gate yet"
alias inctrl.mv.rl.L "echoln [Horizon] You havn't set inctrl.mv.rl.L.gate yet"
alias inctrl.rl.use_autostop.enable "say unsupported;echoln [Horizon] inctrl.rl.use_autostop.enable is not supported"
alias inctrl.rl.use_autostop.disable "alias inctrl.mv.rl.S inctrl.mv.rl.S.gate;alias inctrl.mv.rl.R inctrl.mv.rl.R.gate;alias inctrl.mv.rl.L inctrl.mv.rl.L.gate"
alias inctrl.rl.use_joy "alias inctrl.mv.rl.S.gate mv.basic.joy.rl.S;alias inctrl.mv.rl.R.gate mv.basic.joy.rl.R;alias inctrl.mv.rl.L.gate mv.basic.joy.rl.L"
alias inctrl.rl.use_klb "alias inctrl.mv.rl.S.gate mv.basic.klb.rl.S;alias inctrl.mv.rl.R.gate mv.basic.klb.rl.R;alias inctrl.mv.rl.L.gate mv.basic.klb.rl.L"

// 设置 inctrl 的移动逻辑
// 使用 norm | socd | null

alias inctrl.fb.use_norm "inctrl.norm.fb.00"
alias inctrl.fb.use_socd "inctrl.socd.fb.00"
alias inctrl.fb.use_null "inctrl.null.fb.00"

alias inctrl.rl.use_norm "inctrl.norm.rl.00"
alias inctrl.rl.use_socd "inctrl.socd.rl.00"
alias inctrl.rl.use_null "inctrl.null.rl.00"

// 重置 inctrl
alias inctrl.reset ""