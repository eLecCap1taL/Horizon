// =========================================================================================

// keylib
// =========================================================================================

// keylib.fb

alias keylib.fb.0.to_1 "back -0.5 0 0;keylib.fb.1"
alias keylib.fb.0.to_2 "back 0.5 0 0;keylib.fb.2"
alias keylib.fb.0.reset "forward -999 0 0;back -999 0 0;forward 1 0 0;forward -0.5 0 0;back 0.5 0 0"
alias keylib.fb.0 "alias keylib.stop_fb ;alias keylib.forward keylib.fb.0.to_1;alias keylib.back keylib.fb.0.to_2;alias keylib.fb.reset keylib.fb.0.reset"

alias keylib.fb.1.to_0 "back 0.5 0 0;keylib.fb.0"
alias keylib.fb.1.to_2 "back 1 0 0;keylib.fb.2"
alias keylib.fb.1.reset "forward -999 0 0;back -999 0 0;forward 1 0 0;forward -0.5 0 0;back 0.5 0 0;back -0.5 0 0"
alias keylib.fb.1 "alias keylib.stop_fb keylib.fb.1.to_0;alias keylib.forward ;alias keylib.back keylib.fb.1.to_2;alias keylib.fb.reset keylib.fb.1.reset"

alias keylib.fb.2.to_0 "back -0.5 0 0;keylib.fb.0"
alias keylib.fb.2.to_1 "back -1 0 0;keylib.fb.1"
alias keylib.fb.2.reset "forward -999 0 0;back -999 0 0;forward 1 0 0;forward -0.5 0 0;back 0.5 0 0;back 0.5 0 0"
alias keylib.fb.2 "alias keylib.stop_fb keylib.fb.2.to_0;alias keylib.forward keylib.fb.2.to_1;alias keylib.back ;alias keylib.fb.reset keylib.fb.2.reset"

alias keylib.fb.reset "keylib.fb.0.reset;keylib.fb.0"
alias keylib.fb.clear_key "forward -999 0 0;back -999 0 0"

// keylib.rl

alias keylib.rl.0.to_1 "left -0.5 0 0;keylib.rl.1"
alias keylib.rl.0.to_2 "left 0.5 0 0;keylib.rl.2"
alias keylib.rl.0.reset "right -999 0 0;left -999 0 0;right 1 0 0;right -0.5 0 0;left 0.5 0 0"
alias keylib.rl.0 "alias keylib.stop_rl ;alias keylib.right keylib.rl.0.to_1;alias keylib.left keylib.rl.0.to_2;alias keylib.rl.reset keylib.rl.0.reset"

alias keylib.rl.1.to_0 "left 0.5 0 0;keylib.rl.0"
alias keylib.rl.1.to_2 "left 1 0 0;keylib.rl.2"
alias keylib.rl.1.reset "right -999 0 0;left -999 0 0;right 1 0 0;right -0.5 0 0;left 0.5 0 0;left -0.5 0 0"
alias keylib.rl.1 "alias keylib.stop_rl keylib.rl.1.to_0;alias keylib.right ;alias keylib.left keylib.rl.1.to_2;alias keylib.rl.reset keylib.rl.1.reset"

alias keylib.rl.2.to_0 "left -0.5 0 0;keylib.rl.0"
alias keylib.rl.2.to_1 "left -1 0 0;keylib.rl.1"
alias keylib.rl.2.reset "right -999 0 0;left -999 0 0;right 1 0 0;right -0.5 0 0;left 0.5 0 0;left 0.5 0 0"
alias keylib.rl.2 "alias keylib.stop_rl keylib.rl.2.to_0;alias keylib.right keylib.rl.2.to_1;alias keylib.left ;alias keylib.rl.reset keylib.rl.2.reset"

alias keylib.rl.reset "keylib.rl.0.reset;keylib.rl.0"
alias keylib.rl.clear_key "right -999 0 0;left -999 0 0"

// keylib
alias keylib.reset "keylib.fb.reset;keylib.rl.reset"
alias keylib.clear_key "keylib.fb.clear_key;keylib.rl.clear_key"