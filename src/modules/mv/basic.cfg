// 将键盘移动封装 (un-multibind), 并维护翻转状态

alias mv.basic.key.fb.S "$forward_clear;$back_clear;            alias mv.basic.key.fb.rev"
alias mv.basic.key.fb.logic_F "$forward_clear;$back_clear;+$forward;  alias mv.basic.key.fb.rev mv.basic.key.fb.logic_B"
alias mv.basic.key.fb.logic_B "$forward_clear;$back_clear;+$back;     alias mv.basic.key.fb.rev mv.basic.key.fb.logic_F"
alias mv.basic.key.fb.logic_norm "alias mv.basic.key.fb.F mv.basic.key.fb.logic_F;alias mv.basic.key.fb.B mv.basic.key.fb.logic_B"
alias mv.basic.key.fb.logic_flip "alias mv.basic.key.fb.F mv.basic.key.fb.logic_B;alias mv.basic.key.fb.B mv.basic.key.fb.logic_F"


alias mv.basic.key.rl.S "$left_clear;$right_clear;              alias mv.basic.key.rl.rev"
alias mv.basic.key.rl.logic_R "$left_clear;$right_clear;+$right;      alias mv.basic.key.rl.rev mv.basic.key.rl.logic_L"
alias mv.basic.key.rl.logic_L "$left_clear;$right_clear;+$left;       alias mv.basic.key.rl.rev mv.basic.key.rl.logic_R"
alias mv.basic.key.rl.logic_norm "alias mv.basic.key.rl.R mv.basic.key.rl.logic_R;alias mv.basic.key.rl.L mv.basic.key.rl.logic_L"
alias mv.basic.key.rl.logic_flip "alias mv.basic.key.rl.R mv.basic.key.rl.logic_L;alias mv.basic.key.rl.L mv.basic.key.rl.logic_R"

// 将手柄移动封装 (multibind), 并维护翻转状态
alias mv.basic.joy.fb.S "forwardback 0 0 0;     alias mv.basic.joy.fb.rev"
alias mv.basic.joy.fb.logic_F "forwardback 1 0 0;     alias mv.basic.joy.fb.rev mv.basic.joy.fb.logic_B"
alias mv.basic.joy.fb.logic_B "forwardback -1 0 0;    alias mv.basic.joy.fb.rev mv.basic.joy.fb.logic_F"
alias mv.basic.joy.fb.logic_norm "alias mv.basic.joy.fb.F mv.basic.joy.fb.logic_F;alias mv.basic.joy.fb.B mv.basic.joy.fb.logic_B"
alias mv.basic.joy.fb.logic_flip "alias mv.basic.joy.fb.F mv.basic.joy.fb.logic_B;alias mv.basic.joy.fb.B mv.basic.joy.fb.logic_F"

alias mv.basic.joy.rl.S "rightleft 0 0 0;       alias mv.basic.joy.rl.rev"
alias mv.basic.joy.rl.logic_R "rightleft 1 0 0;       alias mv.basic.joy.rl.rev mv.basic.joy.rl.logic_L"
alias mv.basic.joy.rl.logic_L "rightleft -1 0 0;      alias mv.basic.joy.rl.rev mv.basic.joy.rl.logic_R"
alias mv.basic.joy.rl.logic_norm "alias mv.basic.joy.rl.R mv.basic.joy.rl.logic_R;alias mv.basic.joy.rl.L mv.basic.joy.rl.logic_L"
alias mv.basic.joy.rl.logic_flip "alias mv.basic.joy.rl.R mv.basic.joy.rl.logic_L;alias mv.basic.joy.rl.L mv.basic.joy.rl.logic_R"

// 将键盘移动封装 (multibind, float), 并维护翻转状态

// 将手柄移动封装 (multibind), 并维护翻转状态
alias mv.basic.klb.fb.S "keylib.stop_fb;     alias mv.basic.klb.fb.rev"
alias mv.basic.klb.fb.logic_F "keylib.forward;     alias mv.basic.klb.fb.rev mv.basic.klb.fb.logic_B"
alias mv.basic.klb.fb.logic_B "keylib.back;    alias mv.basic.klb.fb.rev mv.basic.klb.fb.logic_F"
alias mv.basic.klb.fb.logic_norm "alias mv.basic.klb.fb.F mv.basic.klb.fb.logic_F;alias mv.basic.klb.fb.B mv.basic.klb.fb.logic_B"
alias mv.basic.klb.fb.logic_flip "alias mv.basic.klb.fb.F mv.basic.klb.fb.logic_B;alias mv.basic.klb.fb.B mv.basic.klb.fb.logic_F"

alias mv.basic.klb.rl.S "keylib.stop_rl;       alias mv.basic.klb.rl.rev"
alias mv.basic.klb.rl.logic_R "keylib.right;       alias mv.basic.klb.rl.rev mv.basic.klb.rl.logic_L"
alias mv.basic.klb.rl.logic_L "keylib.left;      alias mv.basic.klb.rl.rev mv.basic.klb.rl.logic_R"
alias mv.basic.klb.rl.logic_norm "alias mv.basic.klb.rl.R mv.basic.klb.rl.logic_R;alias mv.basic.klb.rl.L mv.basic.klb.rl.logic_L"
alias mv.basic.klb.rl.logic_flip "alias mv.basic.klb.rl.R mv.basic.klb.rl.logic_L;alias mv.basic.klb.rl.L mv.basic.klb.rl.logic_R"


// 外部调用逻辑翻转
alias mv.basic.rev "mv.basic.key.fb.rev;mv.basic.key.rl.rev;mv.basic.joy.fb.rev;mv.basic.joy.rl.rev;mv.basic.klb.fb.rev;mv.basic.klb.rl.rev"
alias mv.basic.logic_norm "mv.basic.key.fb.logic_norm;mv.basic.key.rl.logic_norm;mv.basic.joy.fb.logic_norm;mv.basic.joy.rl.logic_norm;mv.basic.klb.fb.logic_norm;mv.basic.klb.rl.logic_norm"
alias mv.basic.logic_flip "mv.basic.key.fb.logic_flip;mv.basic.key.rl.logic_flip;mv.basic.joy.fb.logic_flip;mv.basic.joy.rl.logic_flip;mv.basic.klb.fb.logic_flip;mv.basic.klb.rl.logic_flip"

// 外部应调用 mv.basic.key.rl.R 等进行移动
// basic.cfg 和 rev.cfg 会维护好状态翻转

// 重置: 恢复所有状态机到 S (stop), 正常绑定所有逻辑到 norm
alias mv.basic.reset "mv.basic.key.fb.S;mv.basic.key.rl.S;mv.basic.joy.fb.S;mv.basic.joy.rl.S;mv.basic.klb.fb.S;mv.basic.klb.rl.S;mv.basic.logic_norm"