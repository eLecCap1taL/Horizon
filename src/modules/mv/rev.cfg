// 构建 status 使得重复调用 sw2 不会导致错误翻转
// 调用 sw2 尝试翻转 而内部状态决定 sw2 是否真正调用 go_
// 如此一来可以保证调用 sw2 时一定能切换到正确的状态, 无论实际翻转与否

alias mv.rev.status.go_flip "mv.basic.rev;mv.basic.logic_flip;mv.rev.status.flip"
alias mv.rev.status.flip "alias mv.rev.status.sw2flip;alias mv.rev.status.sw2norm mv.rev.status.go_norm;"

alias mv.rev.status.go_norm "mv.basic.rev;mv.basic.logic_norm;mv.rev.status.norm"
alias mv.rev.status.norm "alias mv.rev.status.sw2norm;alias mv.rev.status.sw2flip mv.rev.status.go_flip;"

// 外部调用 enable/disable 来 开启 / 禁用 翻转
// 外部调用 flip/norm 来进行翻转
// 期望效果: 即使乱序调用 flip/norm 仍能切换到正确的状态, 且当 disable 时 flip/norm 失效, 若正在翻转, 可以自动切换回 norm 并在 enable 时自动换回

alias mv.rev.enable     "alias mv.rev.try_flip mv.rev.status.sw2flip;alias mv.rev.try_norm mv.rev.status.sw2norm;mv.rev.status"
alias mv.rev.disable    "alias mv.rev.try_flip;alias mv.rev.try_norm                                            ;mv.rev.status.sw2norm"

alias mv.rev.flip "alias mv.rev.status mv.rev.flip;mv.rev.try_flip"
alias mv.rev.norm "alias mv.rev.status mv.rev.norm;mv.rev.try_norm"

// 重置: 恢复状态机为 norm, 设置当前状态为 norm, 启用 enable (会触发状态恢复 进而调用 mv.rev.try_norm)
alias mv.rev.reset "mv.rev.status.norm;alias mv.rev.status mv.rev.norm;mv.rev.enable"